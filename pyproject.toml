[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastlabel"
version = "0.1.0"
description = "Reproducible stress tests for active-learning stopping rules"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Reego John-Annaselvan"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn==1.7.2", "matplotlib==3.10.7", "threadpoolctl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "yapf==0.43.0"]

[project.urls]
Repository = "https://github.com/ReegoJA/lastlabel"
Issues = "https://github.com/ReegoJA/lastlabel/issues"

[project.scripts]
stoplab = "stoplab.cli:main"

[tool.setuptools.packages.find]
include = ["stoplab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
